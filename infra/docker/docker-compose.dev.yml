# LOCAL development database only (never the VPS). Requires Docker Desktop.
# Engine/version pinned to match production (VPS: 10.4.32-MariaDB). See docs/adr/0003-database-engine.md.
#
# Usage (from repo root):
#   1. copy infra/docker/docker.env.example to infra/docker/docker.env and set local passwords
#   2. docker compose --env-file infra/docker/docker.env -f infra/docker/docker-compose.dev.yml up -d
# The baseline schema is imported ONLY when the data volume is first created.
name: testboard-local
services:
  mariadb:
    image: mariadb:10.4.32
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Please_set_in_docker_env}
      MARIADB_DATABASE: testboard
      MARIADB_USER: ${MARIADB_USER:-testboard_dev}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Please_set_in_docker_env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../../database/baseline/schema_baseline_reference.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mariadb-data:
