<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Tempat Pusat Pasar Kerja menguji layanan bersama para pengguna sebelum dipakai masyarakat: skenario uji, UAT bersama, dan laporan masalah."
    />
    <meta name="theme-color" content="#17569a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Link preview (WhatsApp, Telegram, Facebook, LinkedIn, X): one card for every page.
      The picture needs a full https address; %SITE_URL% is filled in at build time
      (vite.config.ts, from PUBLIC_URL on the server). No og:url on purpose: every page
      shares this file, so the shared link itself must stay the address.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TestBoard PASKER ID" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="TestBoard PASKER ID · Uji Penerimaan Pengguna (UAT)" />
    <meta
      property="og:description"
      content="Tempat Pusat Pasar Kerja menguji layanan bersama para pengguna sebelum dipakai masyarakat: skenario uji, UAT bersama, dan laporan masalah."
    />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TestBoard oleh PASKER ID - uji layanan bersama pengguna sebelum dipakai masyarakat"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/a11y-boot.js"></script>
    <title>TestBoard PASKER ID</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
